plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'com.timxs.bbs'

repositories {
    // 本地联调：interaction-plus api 已 publishToMavenLocal（~/.m2）
    mavenLocal()
    mavenCentral()
    // 对外发布时启用 JitPack：maven { url 'https://jitpack.io' }
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.25.0')
    compileOnly 'run.halo.app:api'

    // interaction-plus 对外 API 契约（接口 + DTO）：运行时由 interaction-plus 提供，不打进产物。
    // 坐标务必钉死 0.1.0——m2 里的 0.1.1 / 1.0.0-alpha.33 是更早的遗留构件（无 UserStatContributor）
    compileOnly 'com.github.Tim0x0.halo-plugin-interaction-plus:api:0.1.0'

    // plugin-feed 对外 API 契约（RssRouteItem / RSS2）：运行时由 PluginFeed 提供，不打进产物。
    // 坐标钉死 1.4.4——Maven Central 上 run.halo.feed:api 的稳定版（含 RssRouteItem 扩展点）
    compileOnly 'run.halo.feed:api:1.4.4'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.25'
}
