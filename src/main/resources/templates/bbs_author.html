<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="|${author.displayName} 的帖子 - ${bbsTitle}|">作者</title>
  <link rel="stylesheet" th:href="@{/plugins/bbs/assets/static/bbs.css}"/>
</head>
<body class="bbs-body" th:style="'--b-accent:' + ${accentColor}">

<!-- 品牌色顶栏 -->
<header class="bbs-hd">
  <div class="bbs-hd__in">
    <a class="bbs-lg" th:href="@{/bbs}">
      <img class="bbs-lg__img" th:if="${logoUrl != null}" th:src="${logoUrl}" alt=""/>
      <span class="bbs-lg__mark" th:if="${logoUrl == null}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 5 7 9H4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h3l9 4V5z" fill="currentColor" fill-opacity="0.3"/>
          <path d="M19 9a4 4 0 0 1 0 6"/>
        </svg>
      </span>
      <span th:text="${bbsTitle}">BBS 社区</span>
    </a>
    <form class="bbs-hs" method="get" th:action="@{/bbs}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" name="q" placeholder="搜索帖子…"/>
    </form>
  </div>
</header>

<div class="bbs-cols bbs-cols--narrow">
  <main>
    <!-- 面包屑 -->
    <nav class="bbs-crumbs">
      <a th:href="@{/bbs}" th:text="${bbsTitle}">BBS 社区</a>
      <span>/</span>
      <span th:text="${author.displayName}">作者</span>
    </nav>

    <!-- 作者卡片 -->
    <section class="bbs-author">
      <img class="bbs-ava bbs-author__ava" th:if="${!#strings.isEmpty(author.avatar)}"
           th:src="${author.avatar}" th:alt="${author.displayName}"/>
      <span class="bbs-ava bbs-ava--letter bbs-author__ava"
            th:if="${#strings.isEmpty(author.avatar)}"
            th:text="${#strings.substring(author.displayName, 0, 1)}">A</span>
      <div>
        <div class="bbs-author__name" th:text="${author.displayName}">作者</div>
        <div class="bbs-author__meta" th:text="|共 ${posts.total} 篇帖子|">共 0 篇帖子</div>
      </div>
    </section>

    <div class="bbs-list">
      <div class="bbs-it" th:each="p : ${posts.items}">
        <img class="bbs-ava" th:if="${p.owner != null && !#strings.isEmpty(p.owner.avatar)}"
             th:src="${p.owner.avatar}" th:alt="${p.owner.displayName}" loading="lazy"/>
        <span class="bbs-ava bbs-ava--letter"
              th:if="${p.owner == null || #strings.isEmpty(p.owner.avatar)}"
              th:style="${p.category != null && p.category.color != null ? 'background:' + p.category.color : ''}"
              th:text="${p.owner != null ? #strings.substring(p.owner.displayName, 0, 1) : '匿'}">A</span>
        <div class="bbs-it__main">
          <a class="bbs-it__link" th:href="@{${p.permalink}}">
            <span class="bbs-it__title" th:text="${p.title}">帖子标题</span>
          </a>
          <div class="bbs-tags" th:if="${p.category != null || p.pinned || p.type == 'ANNOUNCEMENT'}">
            <span class="bbs-tg bbs-tg--ann" th:if="${p.type == 'ANNOUNCEMENT'}">公告</span>
            <span class="bbs-tg" th:if="${p.category != null}"
                  th:style="${p.category.color != null ? 'background:' + p.category.color : ''}"
                  th:text="${p.category.displayName}">分类</span>
            <span class="bbs-tg bbs-tg--pin" th:if="${p.pinned}">置顶</span>
          </div>
          <p class="bbs-it__excerpt" th:if="${!#strings.isEmpty(p.excerpt)}"
             th:text="${p.excerpt}">摘要</p>
          <div class="bbs-it__meta">
            <span th:if="${p.publishTime != null}"
                  th:text="|发布于 ${#temporals.format(p.publishTime, 'yyyy-MM-dd')}|">发布于</span>
            <span th:if="${p.lastEditTime != null}"> · 已编辑</span>
          </div>
        </div>
        <a class="bbs-rc" th:href="@{${p.permalink} + '#comments'}" title="查看评论">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span th:text="${p.commentCount != null ? p.commentCount : 0}">0</span>
        </a>
      </div>

      <div class="bbs-empty" th:if="${#lists.isEmpty(posts.items)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>TA 还没有发布过帖子</p>
      </div>
    </div>

    <!-- 分页 -->
    <nav class="bbs-pg" th:if="${posts.total > posts.size}"
         th:with="totalPages=${(posts.total + posts.size - 1) / posts.size}">
      <a class="bbs-pg__btn" th:if="${currentPage > 1}"
         th:href="@{'/bbs/u/' + ${author.name}(page=${currentPage - 1})}">‹ 上一页</a>
      <span class="bbs-pg__btn is-disabled" th:if="${currentPage <= 1}">‹ 上一页</span>
      <span class="bbs-pg__info" th:text="|${currentPage} / ${totalPages}|">1 / 1</span>
      <a class="bbs-pg__btn" th:if="${currentPage < totalPages}"
         th:href="@{'/bbs/u/' + ${author.name}(page=${currentPage + 1})}">下一页 ›</a>
      <span class="bbs-pg__btn is-disabled" th:if="${currentPage >= totalPages}">下一页 ›</span>
    </nav>

    <footer class="bbs-foot">
      <a th:href="@{/bbs}">← 返回 <span th:text="${bbsTitle}">BBS 社区</span></a>
    </footer>
  </main>
</div>

</body>
</html>
