apiVersion: v1alpha1
kind: Setting
metadata:
  name: bbs-settings
spec:
  forms:
    # ------------------------------------------------------------------
    # 外观：品牌 / Hero / SEO·页脚
    # ConfigMap 键 appearance —— 组内用 $formkit:group 分段（存盘为嵌套 JSON）
    # ------------------------------------------------------------------
    - group: appearance
      label: 外观
      formSchema:
        - $formkit: group
          name: brand
          label: 品牌
          children:
            - $formkit: text
              name: pageTitle
              label: 前台页面标题
              value: "BBS 社区"
            - $formkit: attachmentInput
              name: logo
              label: 社区 Logo
              help: 展示在前台顶栏；留空显示默认图标
              accepts:
                - "image/*"
              value: ""
            - $formkit: text
              name: slogan
              label: 社区副标题
              help: Hero、浏览器标题与 SEO 描述
              value: ""
            - $formkit: text
              name: titleSeparator
              label: 标题分隔符
              help: 浏览器标题如「BBS 社区 - 副标题」
              value: "-"
            - $formkit: color
              name: accentColor
              label: 前台主题色
              format: hex8
              help: 顶栏、Hero、按钮与置顶徽标
              value: "#4d698e"

        - $formkit: group
          name: hero
          label: Hero
          children:
            - $formkit: switch
              name: showHero
              id: show_hero
              label: 显示 Hero 区
              help: 关闭后列表页不展示标题横幅
              value: true
            - $formkit: select
              if: "$get(show_hero).value === true"
              name: heroStyle
              id: hero_style
              label: Hero 背景
              value: "color"
              options:
                - label: 纯色（主题色）
                  value: "color"
                - label: 图片 Banner
                  value: "image"
            - $formkit: attachmentInput
              if: "$get(show_hero).value === true && $get(hero_style).value === 'image'"
              name: bannerImage
              label: Banner 图片
              help: 建议宽度 ≥ 1600px
              accepts:
                - "image/*"
              value: ""

        - $formkit: group
          name: seo
          label: 页脚
          children:
            - $formkit: textarea
              name: footerNotice
              label: 页脚声明
              help: 展示在前台页脚；清空则不显示
              value: "本社区内容由用户发布，不代表站点立场"

    # ------------------------------------------------------------------
    # 浏览：列表 / 详情 / RSS
    # ------------------------------------------------------------------
    - group: browsing
      label: 浏览
      formSchema:
        - $formkit: group
          name: list
          label: 列表
          children:
            - $formkit: number
              name: pageSize
              label: 帖子列表每页条数
              value: 10
              min: 1
              max: 50
              validation: min:1|max:50
            - $formkit: switch
              name: listShowExcerpt
              label: 列表显示摘要
              help: 在标题下方展示摘要（最多两行）
              value: false
            - $formkit: select
              name: dateFormat
              label: 时间显示格式
              help: 列表与详情的时间格式
              value: "relative"
              options:
                - label: 相对时间
                  value: "relative"
                - label: yyyy-MM-dd
                  value: "yyyy-MM-dd"
                - label: yyyy-MM-dd HH:mm
                  value: "yyyy-MM-dd HH:mm"
                - label: MM-dd
                  value: "MM-dd"

        - $formkit: group
          name: detail
          label: 详情
          children:
            - $formkit: number
              name: relatedPostCount
              label: 相关推荐条数
              help: 详情页底部推荐数量；0 为关闭
              value: 5
              min: 0
              max: 20
              validation: min:0|max:20
            - $formkit: select
              name: relatedPostStrategy
              label: 相关推荐方式
              help: 详情页底部推荐的排序策略
              value: "category-latest"
              options:
                - label: 同分类最新
                  value: "category-latest"
                - label: 全站最新
                  value: "latest"
                - label: 最多回复
                  value: "most-reply"
                - label: 同作者
                  value: "same-author"
                - label: 相关度
                  value: "relevance"
            - $formkit: switch
              name: enableToc
              label: 显示正文目录
              help: 正文 h2/h3 满 3 个时生成
              value: true

        - $formkit: group
          name: rss
          label: RSS
          children:
            - $formkit: number
              name: rssSize
              label: RSS 条目数
              help: 需先安装 plugin-feed
              value: 20
              min: 1
              max: 100
              validation: min:1|max:100

    # ------------------------------------------------------------------
    # 内容：发帖约束 + 审核
    # ------------------------------------------------------------------
    - group: content
      label: 内容
      formSchema:
        - $formkit: group
          name: posting
          label: 发帖约束
          children:
            - $formkit: number
              name: titleMaxLength
              label: 标题最大长度
              help: 按字符计；超出拒绝保存
              value: 100
              min: 10
              max: 200
              validation: min:10|max:200

        - $formkit: group
          name: review
          label: 审核
          children:
            - $formkit: switch
              name: requireReview
              id: require_review
              label: 用户发帖需审核
              help: 用户中心发帖须审核后展示
              value: false
            - $formkit: switch
              if: "$get(require_review).value === true"
              name: reviewOnEdit
              label: 编辑已发布内容需重新审核
              help: 编辑已发布的帖子需重新审核
              value: true

    # ------------------------------------------------------------------
    # 集成：互动增强 / 作者链接
    # ------------------------------------------------------------------
    - group: integration
      label: 集成
      formSchema:
        - $formkit: group
          name: interaction
          label: 互动增强
          children:
            - $formkit: switch
              name: enableInteractionPlus
              id: enable_interaction_plus
              label: 接入互动增强
              help: 需启用 interaction-plus
              value: false
            - $formkit: switch
              if: "$get(enable_interaction_plus).value === true"
              name: listDecoration
              label: 列表页用户装扮
              help: 显示头像框、昵称样式与身份标识
              value: false
        - $formkit: text
          name: authorLinkTemplate
          label: 作者链接模板
          help: "{name} 替换为用户名，留空不跳转"
          value: "/authors/{name}"
