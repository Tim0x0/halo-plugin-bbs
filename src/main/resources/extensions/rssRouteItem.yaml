# plugin-feed 扩展点声明：给 ExtensionGetter / Console 展示用。
# 实际 RSS 源由 BbsFeedIntegration 在 plugin-feed 在场时以 @Bean 注册
# （全站 /feed/bbs/posts.xml + 分类 /feed/bbs/categories/{slug}.xml）。
apiVersion: plugin.halo.run/v1alpha1
kind: ExtensionDefinition
metadata:
  name: bbs-rss-route-item
spec:
  className: com.timxs.bbs.integration.BbsRssRouteItem
  extensionPointName: feed-rss-route-item
  displayName: "BBS 社区 RSS"
  description: "把 BBS 社区最新发布的帖子与公告作为 RSS 源贡献给 plugin-feed"
