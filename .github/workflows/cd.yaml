name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v4
    permissions:
      contents: write
    with:
      ui-path: "ui"
      pnpm-version: 10
      node-version: 24
      java-version: 21
      # 如需发布到 Halo 应用市场：删除 skip-appstore-release 并配置 app-id
      skip-appstore-release: true
      # app-id: app-xyz
