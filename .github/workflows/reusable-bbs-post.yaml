# 可复用工作流（workflow_call）：Release 发布后自动在 BBS 社区发帖（更新已有帖而非重复创建）
#
# 本文件不含触发条件，由调用方工作流以 jobs.<id>.uses 引用并传参：
#   - 本仓库入口 bbs-post.yaml：uses: ./.github/workflows/reusable-bbs-post.yaml
#   - 其他仓库：uses: Tim0x0/halo-plugin-bbs/.github/workflows/reusable-bbs-post.yaml@main
#     （接入模板与配置项见 README「Release 自动发帖」）
#
# 运行上下文属于调用方仓库：github 事件负载、$GITHUB_REPOSITORY、GITHUB_TOKEN 均指向调用方，
# 读取的 release 即调用方仓库的 release；站点地址 / 分类 / 令牌由 inputs / secrets 传入。
#
# 依赖插件 Console 端点（无需改 Java 代码）：
#   GET  /apis/console.api.bbs.timxs.com/v1alpha1/bbsposts?keyword=   按 slug 找已有帖
#   POST /apis/console.api.bbs.timxs.com/v1alpha1/bbsposts?publish=   创建
#   PUT  /apis/console.api.bbs.timxs.com/v1alpha1/bbsposts/{name}     更新（已发布帖写入工作稿）
#   PUT  /apis/console.api.bbs.timxs.com/v1alpha1/bbsposts/{name}/publish  提升工作稿为前台版本
#
# 行为约定：
#   - 帖子别名固定为 release-<tag 归一>（如 v1.2.3 → release-v123），以此识别「同一版本的帖子」：
#     删了 release 重发、手动重跑都只会更新已有帖，不会刷屏。
#   - 状态智能区分：正式 release → 直接发布；prerelease → 存草稿（status 入参可覆盖）。
#   - 正文由 release notes（Markdown）经 pandoc 转 HTML 后提交，服务端会再过白名单净化。
#   - 与调用方的 CD 工作流同时被 release 事件触发时，轮询等待 CD 上传完 jar 资产再拼下载链接。

name: 同步 BBS 公告

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag（如 v1.2.3）。留空则取触发本次运行的 release 事件；手动运行时必填'
        type: string
        required: false
        default: ''
      status:
        description: '帖子状态：auto（正式 release=发布，prerelease=草稿）/ published / draft'
        type: string
        required: false
        default: auto
      title:
        description: '标题。留空自动生成：有 project-name 则为「前缀 tag 发布说明」，否则「tag 发布说明」'
        type: string
        required: false
        default: ''
      halo-base-url:
        description: 'Halo 站点地址（如 https://example.com），须可被 GitHub 公网访问'
        type: string
        required: true
      category-name:
        description: '目标分类的 metadata.name（形如 category-xxxx，不是显示名）'
        type: string
        required: true
      project-name:
        description: '标题前缀，按原样拼接（如「[BBS 社区]」或「BBS 社区 |」）；空则标题不带前缀'
        type: string
        required: false
        default: ''
    secrets:
      bbs-post-pat:
        description: 'Halo 站点的个人访问令牌，持牌用户需有 BBS 版主（bbs-moderate）及以上角色'
        required: true

jobs:
  sync-bbs-post:
    name: 同步帖子
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 同一 tag 的操作串行，避免并发下「查无此帖 → 双双创建」
    concurrency:
      group: bbs-release-post-${{ inputs.tag || github.event.release.tag_name }}
    env:
      HALO_BASE_URL: ${{ inputs.halo-base-url }}
      BBS_CATEGORY_NAME: ${{ inputs.category-name }}
      BBS_PROJECT_NAME: ${{ inputs.project-name }}
    steps:
      - name: 校验入参
        env:
          BBS_POST_PAT: ${{ secrets.bbs-post-pat }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          missing=""
          [ -n "$HALO_BASE_URL" ] || missing="$missing halo-base-url"
          [ -n "$BBS_CATEGORY_NAME" ] || missing="$missing category-name"
          [ -n "$BBS_POST_PAT" ] || missing="$missing bbs-post-pat"
          if [ -n "$missing" ]; then
            echo "::error::缺少入参:$missing（调用方未传，或对应的仓库 Variable / Secret 为空：Settings → Secrets and variables → Actions）"
            exit 1
          fi
          case "${INPUT_STATUS:-auto}" in
            auto|published|draft) ;;
            *) echo "::error::status 只能是 auto / published / draft，收到「$INPUT_STATUS」"; exit 1 ;;
          esac
          if [ -z "$INPUT_TAG" ] && [ "$GITHUB_EVENT_NAME" != "release" ]; then
            echo "::error::非 release 事件触发时必须提供 tag 入参"
            exit 1
          fi

      - name: 安装 pandoc
        run: command -v pandoc >/dev/null || (sudo apt-get update && sudo apt-get install -y pandoc)

      - name: 准备 Release 内容与标题 / 状态 / 别名
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          # tag 非空：按 tag 查询调用方仓库的 release（手动运行）；tag 为空：读取触发本次运行的
          # release 事件负载。负载把 release 对象嵌在 .release 下（顶层是 action/repository/sender），
          # 须解包取 .release，后面的 .id/.assets/.tag_name 才取得到。
          if [ -n "$INPUT_TAG" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG" \
                > release.json 2> gh-error.txt; then
              echo "::error::读取 tag 为 $INPUT_TAG 的 release 失败（tag 不存在或未发布 release）：$(cat gh-error.txt)"
              exit 1
            fi
          else
            jq '.release' "$GITHUB_EVENT_PATH" > release.json
          fi

          # 调用方的 CD 工作流与本流程同时被 release 事件触发，jar 资产稍后才上传完。
          # 轮询等待 .jar 出现，让帖子里的下载链接不落空；手动运行通常资产已在，秒过。
          RELEASE_ID=$(jq -r '.id' release.json)
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then ASSET_WAIT=480; else ASSET_WAIT=15; fi
          WAITED=0
          while ! jq -e '.assets | map(select(.name | endswith(".jar"))) | length > 0' \
              release.json >/dev/null; do
            if [ "$WAITED" -ge "$ASSET_WAIT" ]; then
              echo "::warning::等待超时仍无 jar 资产（CD 可能失败），帖子将不含下载链接"
              break
            fi
            echo "等待 release 资产上传（已等 ${WAITED}s / 上限 ${ASSET_WAIT}s）…"
            sleep 30
            WAITED=$((WAITED + 30))
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          done

          TAG=$(jq -r '.tag_name' release.json)
          PRERELEASE=$(jq -r '.prerelease' release.json)

          # 状态：正式=发布、预发布=草稿；status 入参可覆盖
          STATUS="${INPUT_STATUS:-auto}"
          case "$STATUS" in
            published) PUBLISH=true ;;
            draft)     PUBLISH=false ;;
            *)         [ "$PRERELEASE" = "true" ] && PUBLISH=false || PUBLISH=true ;;
          esac

          # 别名归一对齐服务端 slugify：小写、空白/下划线转连字符、只留字母数字与连字符。
          # 注意服务端同样剥掉点号（v1.2.3 → v123），两侧必须一致才能互相认领。
          SLUG=$(printf 'release-%s' "$TAG" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[[:space:]_]+/-/g; s/[^a-z0-9-]//g; s/-{2,}/-/g; s/^-+//; s/-+$//')
          [ -n "$SLUG" ] || SLUG="release-$(date +%s)"

          # 正文：release notes（Markdown）→ HTML，前后拼上 release 链接与附件下载。
          # 外链新标签打开；rel 防新页拿到 window.opener。服务端白名单保留 a 的 target / rel。
          jq -r '.body // ""' release.json > release.md
          pandoc -f gfm -t html release.md -o body.html
          python3 - <<'PY'
from pathlib import Path
import re
html = Path("body.html").read_text(encoding="utf-8")
def add_blank(m):
    tag = m.group(0)
    if re.search(r'\btarget=', tag, re.I):
        return tag
    return tag[:-1] + ' target="_blank" rel="noopener noreferrer">'
html = re.sub(r'<a\b[^>]*>', add_blank, html, flags=re.I)
Path("body.html").write_text(html, encoding="utf-8")
PY
          jq -r '"<p>Release 页面：<a href=\"" + .html_url + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + .tag_name + "</a></p>"' \
            release.json > intro.html
          jq -r 'if (.assets | length) > 0
                 then "<h2>下载</h2>\n<ul>" +
                      ([.assets[] | "<li><a href=\"" + .browser_download_url
                        + "\" target=\"_blank\" rel=\"noopener noreferrer\">"
                        + .name + "</a></li>"] | join("")) + "</ul>"
                 else "" end' release.json > assets.html
          cat intro.html body.html assets.html > content.html

          # 标题：title 入参 > 前缀+tag > 仅 tag。前缀按原样拼，不改格式。
          PROJECT_NAME="$(printf '%s' "$BBS_PROJECT_NAME" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$INPUT_TITLE" ]; then
            TITLE="$INPUT_TITLE"
          elif [ -n "$PROJECT_NAME" ]; then
            TITLE="$PROJECT_NAME $TAG 发布说明"
          else
            TITLE="$TAG 发布说明"
          fi

          {
            echo "TAG=$TAG"
            echo "SLUG=$SLUG"
            echo "PUBLISH=$PUBLISH"
            echo "TITLE=$TITLE"
          } >> "$GITHUB_ENV"

      - name: 查找 / 创建 / 更新 BBS 帖子
        env:
          BBS_POST_PAT: ${{ secrets.bbs-post-pat }}
        run: |
          HALO_BASE_URL="${HALO_BASE_URL%/}"
          API="$HALO_BASE_URL/apis/console.api.bbs.timxs.com/v1alpha1"

          jq -n --arg title "$TITLE" \
                --arg categoryName "$BBS_CATEGORY_NAME" \
                --arg slug "$SLUG" \
                --rawfile content content.html \
            '{title: $title, categoryName: $categoryName, slug: $slug,
              type: "ANNOUNCEMENT", autoExcerpt: true, content: $content}' > payload.json

          # 按别名认领同一版本的已有帖（keyword 可匹配 slug，服务端 listConsole 支持；
          # 不依赖标题，标题被人为改过也能认出来）。回收站内的帖不在列表，等同于不存在。
          HTTP=$(curl -s -o resp.json -w '%{http_code}' -G "$API/bbsposts" \
            -H "Authorization: Bearer $BBS_POST_PAT" \
            --data-urlencode "keyword=$SLUG" --data-urlencode "size=50")
          if [ "$HTTP" != "200" ]; then
            echo "::error::查询帖子列表失败（HTTP $HTTP，401 请检查令牌 bbs-post-pat 是否过期）：$(cat resp.json)"
            exit 1
          fi
          MATCH=$(jq --arg slug "$SLUG" \
            '[.items[]? | select(.slug == $slug)] | sort_by(.creationTimestamp) | last' resp.json)
          EXISTING=$(printf '%s' "$MATCH" | jq -r '.name // empty')
          EXISTING_PHASE=$(printf '%s' "$MATCH" | jq -r '.phase // empty')

          if [ -z "$EXISTING" ]; then
            echo "未找到 $SLUG 对应的帖子，创建新帖（publish=$PUBLISH）"
            HTTP=$(curl -s -o resp.json -w '%{http_code}' -X POST \
              "$API/bbsposts?publish=$PUBLISH" \
              -H "Authorization: Bearer $BBS_POST_PAT" -H "Content-Type: application/json" \
              --data @payload.json)
            ACTION="created"
          else
            echo "找到已有帖子 $EXISTING（状态 $EXISTING_PHASE），执行更新"
            HTTP=$(curl -s -o resp.json -w '%{http_code}' -X PUT \
              "$API/bbsposts/$EXISTING" \
              -H "Authorization: Bearer $BBS_POST_PAT" -H "Content-Type: application/json" \
              --data @payload.json)
            ACTION="updated"
            # 已发布帖的 PUT 只写入工作稿，须再调 publish 提升为前台版本；
            # 草稿帖 + 目标发布同样靠这一步提升。publish 幂等安全。
            if [ "$HTTP" = "200" ] && [ "$PUBLISH" = "true" ]; then
              HTTP=$(curl -s -o resp.json -w '%{http_code}' -X PUT \
                "$API/bbsposts/$EXISTING/publish" \
                -H "Authorization: Bearer $BBS_POST_PAT")
            elif [ "$HTTP" = "200" ] && [ "$PUBLISH" = "false" ] \
                 && [ "$EXISTING_PHASE" = "PUBLISHED" ]; then
              # 目标是草稿但帖子已发布：新内容留在工作稿，前台保持已发布版本。
              # 不自动撤稿——撤下已发布内容应由人在后台决定。
              echo "::warning::帖子 $EXISTING 已发布，本次改动保存在工作稿；如需下架请在后台操作"
            fi
          fi

          if [ "$HTTP" != "200" ]; then
            echo "::error::API 调用失败（HTTP $HTTP）：$(cat resp.json)"
            exit 1
          fi

          POST_NAME=$(jq -r '.metadata.name' resp.json)
          # 前台链接以服务端响应的真实别名为准：创建路径撞名时服务端会自动追加
          # 随机后缀（对齐官方创建期行为），此时 $SLUG 已不代表帖子真实别名
          FINAL_SLUG=$(jq -r '.spec.slug // empty' resp.json)
          POST_URL="$HALO_BASE_URL/bbs/post/${FINAL_SLUG:-$SLUG}"
          echo "✅ 完成：$ACTION name=$POST_NAME publish=$PUBLISH"
          [ "$PUBLISH" = "true" ] && echo "前台地址：$POST_URL"
          {
            echo "## BBS 发帖结果"
            echo "- 操作：$([ "$ACTION" = "created" ] && echo 创建 || echo 更新)"
            echo "- 标题：$TITLE"
            echo "- 状态：$([ "$PUBLISH" = "true" ] && echo 已发布 || echo 草稿)"
            if [ "$PUBLISH" = "true" ]; then echo "- 前台地址：$POST_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
